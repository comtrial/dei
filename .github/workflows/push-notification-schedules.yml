name: Push Notification Schedules

# Rooms-pivot 갱신:
#   - 옛 'send-curation-ready' (09:00 KST) 폐기 → rooms 매칭/알림으로 의미 이동.
#   - 새 cron 5개 추가: hourly-upload, blur-gate-remind, blur-gate-reapply,
#     rematch-available, expire-rooms, purge-expired-uploads.
#   - 모든 cron 함수는 `dryRun`, `limit`, `now` 옵션 지원 (`workflow_dispatch`).
#   - 기존 send-log-reminders (개인 일상 로그) 는 그대로 KEEP.
#
# Cron timing (UTC → KST=+9h):
#   '0 3,7,11,15,19,23 * * *'  ▶ send-log-reminders    (4h마다, KST 00·04·08·12·16·20)
#   '0 * * * *'                ▶ notify-hourly-upload  (매시간 정각)
#   '0 * * * *'                ▶ expire-rooms          (매시간 정각, 같이 처리)
#   '*/15 * * * *'             ▶ notify-blur-gate-remind  (15분마다)
#   '*/15 * * * *'             ▶ notify-blur-gate-reapply (15분마다, 같이 처리)
#   '*/15 * * * *'             ▶ notify-rematch-available (15분마다, 같이 처리)
#   '0 19 * * *'               ▶ purge-expired-uploads  (KST 04:00)

on:
  schedule:
    - cron: '0 3,7,11,15,19,23 * * *'
    - cron: '0 * * * *'
    - cron: '*/15 * * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which notification batch to run'
        options:
          - all
          - log-reminders
          - hourly-upload
          - expire-rooms
          - blur-gate-remind
          - blur-gate-reapply
          - rematch-available
          - purge-expired-uploads
        required: true
        type: choice
        default: all
      dry_run:
        description: 'Run without sending push notifications'
        required: true
        type: boolean
        default: true
      limit:
        description: 'Maximum users/rows to scan'
        required: true
        type: number
        default: 200

concurrency:
  group: push-notification-schedules-${{ github.event_name }}-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

env:
  SUPABASE_FUNCTIONS_URL: https://sjlzidjnpczysygnlmtk.supabase.co/functions/v1

jobs:
  run-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Select scheduled batches
        id: select
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.inputs.target || '' }}"
          dry_run="${{ github.event.inputs.dry_run || 'false' }}"
          limit="${{ github.event.inputs.limit || '500' }}"

          run_logs=false
          run_hourly=false
          run_expire=false
          run_blur_remind=false
          run_blur_reapply=false
          run_rematch_avail=false
          run_purge=false

          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 3,7,11,15,19,23 * * *")
                run_logs=true ;;
              "0 * * * *")
                run_hourly=true; run_expire=true ;;
              "*/15 * * * *")
                run_blur_remind=true; run_blur_reapply=true; run_rematch_avail=true ;;
              "0 19 * * *")
                run_purge=true ;;
              *) echo "::error::Unknown schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          else
            case "$target" in
              all)
                run_logs=true; run_hourly=true; run_expire=true
                run_blur_remind=true; run_blur_reapply=true
                run_rematch_avail=true; run_purge=true ;;
              log-reminders)        run_logs=true ;;
              hourly-upload)        run_hourly=true ;;
              expire-rooms)         run_expire=true ;;
              blur-gate-remind)     run_blur_remind=true ;;
              blur-gate-reapply)    run_blur_reapply=true ;;
              rematch-available)    run_rematch_avail=true ;;
              purge-expired-uploads) run_purge=true ;;
              *) echo "::error::Unknown target: $target"; exit 1 ;;
            esac
          fi

          {
            echo "run_logs=$run_logs"
            echo "run_hourly=$run_hourly"
            echo "run_expire=$run_expire"
            echo "run_blur_remind=$run_blur_remind"
            echo "run_blur_reapply=$run_blur_reapply"
            echo "run_rematch_avail=$run_rematch_avail"
            echo "run_purge=$run_purge"
            echo "dry_run=$dry_run"
            echo "limit=$limit"
          } >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret"
            exit 1
          fi
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Invoke notification batches
        shell: bash
        env:
          DRY_RUN: ${{ steps.select.outputs.dry_run }}
          LIMIT: ${{ steps.select.outputs.limit }}
          RUN_LOGS: ${{ steps.select.outputs.run_logs }}
          RUN_HOURLY: ${{ steps.select.outputs.run_hourly }}
          RUN_EXPIRE: ${{ steps.select.outputs.run_expire }}
          RUN_BLUR_REMIND: ${{ steps.select.outputs.run_blur_remind }}
          RUN_BLUR_REAPPLY: ${{ steps.select.outputs.run_blur_reapply }}
          RUN_REMATCH_AVAIL: ${{ steps.select.outputs.run_rematch_avail }}
          RUN_PURGE: ${{ steps.select.outputs.run_purge }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          call_function() {
            local name="$1"
            local payload
            payload="$(jq -nc \
              --argjson dryRun "$DRY_RUN" \
              --argjson limit "$LIMIT" \
              '{ dryRun: $dryRun, limit: $limit }')"

            echo "Invoking $name with payload: $payload"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "${SUPABASE_FUNCTIONS_URL}/${name}"
            echo
          }

          [ "$RUN_LOGS" = "true" ]          && call_function "send-log-reminders"
          [ "$RUN_HOURLY" = "true" ]        && call_function "notify-hourly-upload"
          [ "$RUN_EXPIRE" = "true" ]        && call_function "expire-rooms"
          [ "$RUN_BLUR_REMIND" = "true" ]   && call_function "notify-blur-gate-remind"
          [ "$RUN_BLUR_REAPPLY" = "true" ]  && call_function "notify-blur-gate-reapply"
          [ "$RUN_REMATCH_AVAIL" = "true" ] && call_function "notify-rematch-available"
          [ "$RUN_PURGE" = "true" ]         && call_function "purge-expired-uploads"

          exit 0
