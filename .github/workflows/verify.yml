name: Verify

# dei 앱 전체 머지 게이트 (spec §9 · 핸드오프 README "검증 게이트").
# ※ 방(room) 기능만 검증하는 게 아니라 앱 전반(DS 강제·타입·유닛·컴포넌트·통합)을 검증한다.
#
# 직렬 needs: 체인 — 하나라도 실패하면 머지 차단. 집계 잡 `verify` 가
# branch protection 의 required status check 다.
#
#   ds-enforce(DS 강제 lint) → typecheck → unit → component → integration → e2e-web
#
# ds-enforce = 사용자 요구 "DS 안 쓰면 PR 이 CI 에서 튕기게". app/ 의 raw 스타일
# (inline style / raw hex / StyleSheet.create)을 ESLint 가 error 로 막고,
# --max-warnings=0 이라 경고도 통과 못 한다.
#
# e2e-web(Playwright)은 S13a 방 내부 채팅 화면 구현 완료로 재추가됐다. 하네스가
# 프로덕션 view(RoomChatView)를 RN-web 으로 마운트해 전체화면 헤더·them/me/whisper
# 버블·멘션·빈상태·방종료·컴포저 가림없음을 DOM 레벨로 검증한다
# (apps/mobile/e2e/playwright/specs/s13a-room-chat.spec.ts).

on:
  pull_request:
    branches: [main, 'release/**']
  # push 는 main 직접 반영(머지 후) 보호용으로만. release/feature 브랜치 검증은
  # pull_request 트리거가 담당한다 — push+pull_request 를 둘 다 release 에 걸면
  # 같은 커밋에 run 2개가 동시에 떠 integration 의 supabase 포트(54322)를
  # 서로 점유하다 한쪽이 "address already in use" 로 깨진다(실제 발생).
  push:
    branches: [main]

concurrency:
  # event 까지 group 에 포함해, 혹시 중복 트리거돼도 같은 그룹이면 이전 run 을 취소.
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ds-enforce:
    name: ds-enforce (DS 강제 lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # app/ 의 디자인 시스템 강제 룰(D-04). 경고 0 이어야 통과.
      - run: pnpm ds-enforce

  typecheck:
    name: typecheck
    needs: ds-enforce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # 모노레포 전역 typecheck (mobile 은 메인 tsconfig — e2e 하네스 제외).
      - run: pnpm typecheck

  unit:
    name: unit (vitest)
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # 토큰/로직/정책(vitest) + @dei/shared + mobile lib(chat 멘션/길이/스크롤/머지).
      - run: pnpm --filter @dei/ui exec vitest run
      - run: pnpm --filter @dei/shared test
      - run: pnpm --filter mobile test:unit

  component:
    name: component (jest)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # @dei/ui 컴포넌트 + mobile 컴포넌트(RoomChatView) 테스트(jest-expo + RNTL).
      - run: pnpm --filter @dei/ui exec jest
      - run: pnpm --filter mobile test:component

  integration:
    name: integration (real Supabase)
    needs: component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm dlx supabase start
      - name: Inject keys + run integration
        env:
          RUN_INTEGRATION: '1'
        run: |
          STATUS=$(pnpm dlx supabase status -o env)
          export EXPO_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | grep -E '^API_URL=' | cut -d= -f2- | tr -d '"')
          export EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | grep -E '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          # service-role 키 주입 — send-message-rpc.test.ts 가 makeServiceClient()/hasServiceRoleKey()
          # 로 service-role 을 요구한다. 미주입 시 그 스위트가 통째로 SKIP → CLAUDE.md 룰3
          # ("실행 0건이면 FAIL / skip=통과 금지") 위반. 반드시 export 해 실제 실행시킨다.
          export SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep -E '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
          pnpm --filter mobile test:integration
      - name: Stop local Supabase
        if: always()
        run: pnpm dlx supabase stop || true

  e2e-web:
    name: e2e-web (Playwright)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Chromium 만 설치(하네스는 chromium 프로젝트 단일).
      - name: Install Playwright Chromium
        run: pnpm --filter mobile exec playwright install --with-deps chromium
      # 프로덕션 view(RoomChatView)를 RN-web 하네스로 마운트해 DOM 레벨 검증.
      - name: Run e2e-web
        run: pnpm --filter mobile test:e2e:web

  # 집계 잡 — branch protection 의 required check 로 지정한다.
  verify:
    name: verify
    needs: [ds-enforce, typecheck, unit, component, integration, e2e-web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate result
        run: |
          if [ "${{ needs.ds-enforce.result }}" != "success" ] \
            || [ "${{ needs.typecheck.result }}" != "success" ] \
            || [ "${{ needs.unit.result }}" != "success" ] \
            || [ "${{ needs.component.result }}" != "success" ] \
            || [ "${{ needs.integration.result }}" != "success" ] \
            || [ "${{ needs.e2e-web.result }}" != "success" ]; then
            echo "verify 게이트 실패 — 위 잡 중 하나 이상이 통과하지 못했습니다."
            exit 1
          fi
          echo "verify 게이트 전부 통과 ✅"
